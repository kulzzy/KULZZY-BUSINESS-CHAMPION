<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06122a">
<title>Business Champion of the Week</title>

<style>
:root {
  --navy: #06122a;
  --gold: #ffd700;
  --white: #fff;
  --muted: #b7c3d7;
  --green: #20c779;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--navy);
  color: var(--white);
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 24px 12px 16px;
}

.trophy {
  font-size: 38px;
}

h1 {
  color: var(--gold);
  font-size: clamp(23px, 6vw, 34px);
  line-height: 1.2;
  margin: 8px 0;
}

.live {
  display: inline-block;
  margin-top: 6px;
  color: var(--green);
  font-size: 12px;
  font-weight: bold;
}

main {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 12px;
}

.panel {
  padding: 15px;
  margin-bottom: 17px;
  border: 1px solid #293b5b;
  border-radius: 13px;
  background: #0b1b37;
}

.section-title {
  margin: 0 0 14px;
  color: var(--gold);
  font-size: 17px;
}

.competition-title {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 9px;
}

.dates {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}

.business {
  min-width: 0;
  overflow: hidden;
  border: 1px solid #293b5b;
  border-radius: 13px;
  background: #0b1b37;
}

.image-button {
  display: block;
  width: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: #102343;
  cursor: pointer;
}

.business-image {
  display: block;
  width: 100%;
  height: 190px;
  object-fit: cover;
  background: #102343;
}

.business-content {
  padding: 14px;
}

.business-name {
  margin: 0 0 8px;
  font-size: 19px;
  overflow-wrap: anywhere;
}

.description {
  margin: 0 0 13px;
  color: #d1d9e8;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.rank {
  color: var(--gold);
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 12px;
}

.action-button {
  display: block;
  width: 100%;
  padding: 13px 10px;
  border: 0;
  border-radius: 9px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.support {
  background: var(--gold);
  color: var(--navy);
}

.support:disabled,
.image-button:disabled {
  opacity: .7;
  cursor: wait;
}

.share {
  margin-top: 8px;
  background: #172b4b;
  color: white;
  border: 1px solid #334968;
}

.message {
  min-height: 16px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}

.empty,
.error {
  text-align: center;
  color: var(--muted);
  padding: 20px 8px;
  font-size: 14px;
}

.error {
  color: #ff9a9a;
}

.retry {
  margin-top: 10px;
  background: var(--gold);
  color: var(--navy);
}

footer {
  padding: 20px 10px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
}

footer a {
  color: var(--gold);
  text-decoration: none;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<header>
  <div class="trophy">🏆</div>
  <h1>BUSINESS CHAMPION<br>OF THE WEEK</h1>
  <div id="liveStatus" class="live">CHECKING COMPETITION...</div>
</header>

<main>

  <section id="competitionPanel" class="panel" hidden>
    <div id="competitionTitle" class="competition-title"></div>
    <div id="competitionDates" class="dates"></div>
  </section>

  <section class="panel">
    <h2 class="section-title">PARTICIPATING BUSINESSES</h2>

    <div id="businessGrid" class="grid">
      <div class="empty">Loading businesses...</div>
    </div>

    <div id="pageMessage" class="message"></div>
    <button id="retryButton" class="action-button retry" hidden>
      TRY AGAIN
    </button>
  </section>

</main>

<footer>
  <a href="https://kulzzyradio.com" target="_blank" rel="noopener">
    KULZZY RADIO
  </a>
</footer>

<script>
"use strict";

const SUPABASE_URL =
  "https://qliohhpxpcybawkkuwra.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_p25JoH3NXHjBO2gRBlfgAQ_GejS3jtr";

const API = SUPABASE_URL + "/rest/v1";

const grid = document.getElementById("businessGrid");
const pageMessage = document.getElementById("pageMessage");
const retryButton = document.getElementById("retryButton");
const liveStatus = document.getElementById("liveStatus");

let currentCompetition = null;
let businesses = [];
let leaderboard = [];
let loading = false;

function requestHeaders(extra = {}) {
  return {
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    ...extra
  };
}

async function request(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: requestHeaders(options.headers || {})
  });

  const text = await response.text();
  let result = null;

  try {
    result = text ? JSON.parse(text) : null;
  } catch {
    result = text;
  }

  if (!response.ok) {
    throw new Error(
      result && result.message
        ? result.message
        : "Database request failed (" + response.status + ")"
    );
  }

  return result;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatDate(value) {
  if (!value) return "Not specified";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "Not specified";

  return date.toLocaleString(undefined, {
    day: "numeric",
    month: "short",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

function getVisitorKey() {
  const keyName = "bc_visitor_key";

  try {
    let key = localStorage.getItem(keyName);

    if (!key) {
      key = crypto.randomUUID();
      localStorage.setItem(keyName, key);
    }

    return key;
  } catch {
    return crypto.randomUUID();
  }
}

function getVoteCount(businessId) {
  const row = leaderboard.find(item =>
    String(
      item.business_id ??
      item.bc_business_id ??
      item.id ??
      ""
    ) === String(businessId)
  );

  if (!row) return 0;

  const value =
    row.valid_clicks ??
    row.vote_count ??
    row.votes ??
    row.support_count ??
    row.total_clicks ??
    row.click_count ??
    row.clicks ??
    row.completed_clicks;

  const number = Number(value);

  return Number.isFinite(number) ? number : 0;
}

function renderBusinesses() {
  if (!businesses.length) {
    grid.innerHTML =
      '<div class="empty">No participating businesses yet.</div>';
    return;
  }

  const sorted = [...businesses].sort((a, b) =>
    getVoteCount(b.id) - getVoteCount(a.id)
  );

  grid.innerHTML = sorted.map((business, index) => {
    const id = escapeHTML(business.id);
    const name = escapeHTML(business.business_name);
    const description = escapeHTML(business.description || "");
    const image = business.image_url
      ? escapeHTML(business.image_url)
      : "";

    const imageHTML = image
      ? `
        <button
          type="button"
          class="image-button"
          data-business-id="${id}"
          aria-label="Vote for ${name}">
          <img
            class="business-image"
            src="${image}"
            alt="${name}"
            loading="lazy"
            onerror="this.closest('.image-button').style.display='none'">
        </button>
      `
      : "";

    return `
      <article class="business">
        ${imageHTML}

        <div class="business-content">
          <h3 class="business-name">${name}</h3>

          ${description
            ? `<p class="description">${description}</p>`
            : ""}

          <div class="rank">
            RANK: #${index + 1} &nbsp; · &nbsp;
            VOTES: ${getVoteCount(business.id)}
          </div>

          <button
            type="button"
            class="action-button support"
            data-business-id="${id}"
            ${!currentCompetition ? "disabled" : ""}>
            VOTE FOR THIS BUSINESS
          </button>

          <div
            class="message"
            id="message-${id}"
            aria-live="polite"></div>

          <button
            type="button"
            class="action-button share"
            data-share-id="${id}">
            SHARE BUSINESS
          </button>
        </div>
      </article>
    `;
  }).join("");

  grid.querySelectorAll("[data-business-id]").forEach(button => {
    button.addEventListener("click", () => {
      voteForBusiness(button.dataset.businessId);
    });
  });

  grid.querySelectorAll("[data-share-id]").forEach(button => {
    button.addEventListener("click", () => {
      shareBusiness(button.dataset.shareId);
    });
  });
}

async function loadCompetition() {
  const now = new Date().toISOString();

  const rows = await request(
    "/bc_competitions?select=id,title,starts_at,ends_at,status,winner_business_id" +
    "&status=eq.active" +
    "&starts_at=lte." + encodeURIComponent(now) +
    "&ends_at=gte." + encodeURIComponent(now) +
    "&order=starts_at.desc&limit=1"
  );

  currentCompetition = rows?.length ? rows[0] : null;

  const panel = document.getElementById("competitionPanel");

  if (!currentCompetition) {
    panel.hidden = true;
    liveStatus.textContent = "NO ACTIVE COMPETITION";
    return;
  }

  panel.hidden = false;

  document.getElementById("competitionTitle").textContent =
    currentCompetition.title || "BUSINESS CHAMPION OF THE WEEK";

  document.getElementById("competitionDates").textContent =
    "START: " + formatDate(currentCompetition.starts_at) +
    " | END: " + formatDate(currentCompetition.ends_at);

  liveStatus.textContent = "● COMPETITION LIVE";
}

async function loadBusinesses() {
  businesses = await request(
    "/bc_businesses?select=id,business_name,whatsapp_number,description,image_url,advertisement_url,is_active,created_at" +
    "&is_active=eq.true&order=created_at.desc&limit=100"
  );

  try {
    leaderboard = await request("/bc_leaderboard?select=*&limit=500");
  } catch (error) {
    console.error("Leaderboard could not load:", error);
    leaderboard = [];
  }

  renderBusinesses();
}

async function loadPage() {
  if (loading) return;

  loading = true;
  retryButton.hidden = true;
  pageMessage.textContent = "";

  try {
    await loadCompetition();
    await loadBusinesses();

    if (!currentCompetition) {
      pageMessage.textContent = "No active competition right now.";
    }
  } catch (error) {
    console.error(error);

    pageMessage.textContent = error.message;
    retryButton.hidden = false;

    if (!businesses.length) {
      grid.innerHTML =
        '<div class="error">Businesses could not be loaded.</div>';
    }
  } finally {
    loading = false;
  }
}

/*
 * Both the business picture and vote button use this function.
 * A vote is counted only if the existing Supabase tracking RPC
 * successfully completes the visit.
 */
async function voteForBusiness(businessId) {
  if (!currentCompetition) {
    alert("There is no active competition.");
    return;
  }

  const business = businesses.find(item =>
    String(item.id) === String(businessId)
  );

  if (!business) return;

  const message = document.getElementById("message-" + businessId);

  const buttons = [
    ...grid.querySelectorAll("[data-business-id]")
  ].filter(button =>
    button.dataset.businessId === String(businessId)
  );

  buttons.forEach(button => {
    button.disabled = true;

    if (button.classList.contains("support")) {
      button.textContent = "RECORDING VOTE...";
    }
  });

  message.textContent = "";

  try {
    const started = await request("/rpc/bc_start_click", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        p_competition_id: currentCompetition.id,
        p_business_id: business.id,
        p_visitor_key: getVisitorKey()
      })
    });

    const sessionId =
      typeof started === "string"
        ? started
        : Array.isArray(started)
          ? started[0]
          : started?.id ?? started?.session_id;

    if (!sessionId) {
      throw new Error("No tracking session was returned.");
    }

    message.textContent = "Please wait...";

    await new Promise(resolve => setTimeout(resolve, 8000));

    const completed = await request("/rpc/bc_complete_click", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        p_session_id: sessionId
      })
    });

    const valid =
      completed === true ||
      completed === "true" ||
      (Array.isArray(completed) && completed[0] === true);

    if (!valid) {
      throw new Error("Supabase did not confirm a valid vote.");
    }

    message.textContent = "VOTE RECORDED SUCCESSFULLY!";

    buttons.forEach(button => {
      if (button.classList.contains("support")) {
        button.textContent = "VOTE RECORDED";
      }
    });

    await refreshLeaderboard();

  } catch (error) {
    console.error("Vote error:", error);

    message.textContent =
      "Vote failed: " + error.message;

    buttons.forEach(button => {
      button.disabled = false;

      if (button.classList.contains("support")) {
        button.textContent = "TRY AGAIN";
      }
    });
  }
}

async function refreshLeaderboard() {
  try {
    leaderboard = await request("/bc_leaderboard?select=*&limit=500");
    renderBusinesses();
  } catch (error) {
    console.error("Could not refresh votes:", error);
  }
}

async function shareBusiness(businessId) {
  const business = businesses.find(item =>
    String(item.id) === String(businessId)
  );

  if (!business) return;

  const shareData = {
    title: business.business_name,
    text: "Vote for " + business.business_name +
      " in Business Champion of the Week!",
    url: location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(
        shareData.text + " " + shareData.url
      );
      alert("Business link copied.");
    } else {
      prompt("Copy this link:", location.href);
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      prompt("Copy this link:", location.href);
    }
  }
}

retryButton.addEventListener("click", loadPage);

loadPage();
</script>

</body>
</html>
