<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06122a">
<title>Business Champion of the Week</title>

<style>
:root {
  --navy: #06122a;
  --gold: #ffd700;
  --white: #ffffff;
  --muted: #aeb9cc;
  --green: #20c779;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--navy);
  color: var(--white);
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 12px 18px;
}

.trophy {
  font-size: 38px;
}

h1 {
  margin: 8px 0;
  color: var(--gold);
  font-size: clamp(23px, 6vw, 34px);
  line-height: 1.2;
}

.live {
  display: inline-block;
  margin-top: 8px;
  color: var(--green);
  font-size: 12px;
  font-weight: bold;
}

main {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 12px;
}

.panel {
  padding: 16px;
  margin-bottom: 18px;
  border: 1px solid #253655;
  border-radius: 14px;
  background: #0b1b37;
}

.section-title {
  margin: 0 0 14px;
  color: var(--gold);
  font-size: 18px;
}

.competition-title {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 10px;
}

.dates {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}

.business {
  min-width: 0;
  overflow: hidden;
  border: 1px solid #293b5b;
  border-radius: 14px;
  background: #0b1b37;
}

.business-image {
  display: block;
  width: 100%;
  height: 190px;
  object-fit: cover;
  background: #102343;
}

.business-content {
  padding: 14px;
}

.business-name {
  margin: 0 0 8px;
  font-size: 19px;
  overflow-wrap: anywhere;
}

.description {
  margin: 0 0 14px;
  color: #d1d9e8;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.rank {
  color: var(--gold);
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 12px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 13px 10px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.support {
  background: var(--gold);
  color: var(--navy);
}

.support:disabled {
  opacity: .65;
  cursor: wait;
}

.share {
  margin-top: 8px;
  background: #172b4b;
  color: white;
  border: 1px solid #334968;
}

.message {
  min-height: 18px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}

.empty, .error {
  text-align: center;
  color: var(--muted);
  padding: 22px 8px;
  font-size: 14px;
}

.error {
  color: #ff9a9a;
}

.retry {
  margin-top: 10px;
  background: var(--gold);
  color: var(--navy);
}

footer {
  padding: 22px 10px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
}

footer a {
  color: var(--gold);
  text-decoration: none;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<header>
  <div class="trophy">🏆</div>
  <h1>BUSINESS CHAMPION<br>OF THE WEEK</h1>
  <div id="liveStatus" class="live">CHECKING COMPETITION...</div>
</header>

<main>

  <section id="competitionPanel" class="panel" hidden>
    <div id="competitionTitle" class="competition-title"></div>
    <div id="competitionDates" class="dates"></div>
  </section>

  <section class="panel">
    <h2 class="section-title">PARTICIPATING BUSINESSES</h2>
    <div id="businessGrid" class="grid">
      <div class="empty">Loading businesses...</div>
    </div>
    <div id="pageMessage" class="message"></div>
    <button id="retryButton" class="retry" hidden>TRY AGAIN</button>
  </section>

</main>

<footer>
  <a href="https://kulzzyradio.com" target="_blank" rel="noopener">
    KULZZY RADIO
  </a>
</footer>

<script>
"use strict";

/* SUPABASE CONNECTION */
const SUPABASE_URL =
  "https://qliohhpxpcybawkkuwra.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_p25JoH3NXHjBO2gRBlfgAQ_GejS3jtr";

const API = SUPABASE_URL + "/rest/v1";

const grid = document.getElementById("businessGrid");
const pageMessage = document.getElementById("pageMessage");
const retryButton = document.getElementById("retryButton");
const liveStatus = document.getElementById("liveStatus");

let currentCompetition = null;
let businesses = [];
let leaderboard = [];
let loading = false;

function headers(extra = {}) {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    ...extra
  };
}

async function request(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: headers(options.headers || {})
  });

  const text = await response.text();
  let result = null;

  try {
    result = text ? JSON.parse(text) : null;
  } catch {
    result = text;
  }

  if (!response.ok) {
    const message =
      result && result.message
        ? result.message
        : "Request failed (" + response.status + ")";

    throw new Error(message);
  }

  return result;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatDate(value) {
  if (!value) return "Not specified";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "Not specified";

  return date.toLocaleString(undefined, {
    day: "numeric",
    month: "short",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

function newVisitorKey() {
  const keyName = "bc_visitor_key";

  try {
    let key = localStorage.getItem(keyName);

    if (!key) {
      key = crypto.randomUUID();
      localStorage.setItem(keyName, key);
    }

    return key;
  } catch {
    return crypto.randomUUID();
  }
}

function getSupportCount(businessId) {
  const row = leaderboard.find(item =>
    String(
      item.business_id ??
      item.id ??
      item.bc_business_id ??
      ""
    ) === String(businessId)
  );

  if (!row) return null;

  const count =
    row.valid_clicks ??
    row.support_count ??
    row.total_clicks ??
    row.click_count ??
    row.clicks ??
    row.completed_clicks;

  return count == null ? null : Number(count);
}

function getBusinessOrder(a, b) {
  const countA = getSupportCount(a.id);
  const countB = getSupportCount(b.id);

  if (countA !== null && countB !== null) {
    return countB - countA;
  }

  return 0;
}

function renderBusinesses() {
  if (!businesses.length) {
    grid.innerHTML =
      '<div class="empty">No participating businesses yet.</div>';
    return;
  }

  const sorted = [...businesses].sort(getBusinessOrder);

  grid.innerHTML = sorted.map((business, index) => {
    const name = escapeHTML(business.business_name);
    const description = escapeHTML(business.description || "");
    const image = business.image_url
      ? escapeHTML(business.image_url)
      : "";

    const count = getSupportCount(business.id);

    const imageHTML = image
      ? `<img class="business-image"
          src="${image}"
          alt="${name}"
          loading="lazy"
          onerror="this.style.display='none'">`
      : "";

    return `
      <article class="business">
        ${imageHTML}
        <div class="business-content">
          <h3 class="business-name">${name}</h3>

          ${description
            ? `<p class="description">${description}</p>`
            : ""}

          <div class="rank">
            RANK: #${index + 1}
            ${count !== null ? " · SUPPORTS: " + count : ""}
          </div>

          <button
            class="support"
            data-business-id="${escapeHTML(business.id)}"
            ${!currentCompetition ? "disabled" : ""}>
            SUPPORT THIS BUSINESS
          </button>

          <div class="message" id="message-${escapeHTML(business.id)}"></div>

          <button
            class="share"
            data-share-id="${escapeHTML(business.id)}">
            SHARE BUSINESS
          </button>
        </div>
      </article>
    `;
  }).join("");

  grid.querySelectorAll("[data-business-id]").forEach(button => {
    button.addEventListener("click", () => {
      supportBusiness(button.dataset.businessId, button);
    });
  });

  grid.querySelectorAll("[data-share-id]").forEach(button => {
    button.addEventListener("click", () => {
      shareBusiness(button.dataset.shareId);
    });
  });
}

async function loadCompetition() {
  const now = new Date().toISOString();

  const rows = await request(
    "/bc_competitions?select=id,title,starts_at,ends_at,status,winner_business_id" +
    "&status=eq.active" +
    "&starts_at=lte." + encodeURIComponent(now) +
    "&ends_at=gte." + encodeURIComponent(now) +
    "&order=starts_at.desc&limit=1"
  );

  currentCompetition = rows && rows.length ? rows[0] : null;

  const panel = document.getElementById("competitionPanel");

  if (!currentCompetition) {
    panel.hidden = true;
    liveStatus.textContent = "NO ACTIVE COMPETITION";
    return;
  }

  panel.hidden = false;

  document.getElementById("competitionTitle").textContent =
    currentCompetition.title || "BUSINESS CHAMPION OF THE WEEK";

  document.getElementById("competitionDates").textContent =
    "START: " + formatDate(currentCompetition.starts_at) +
    "  |  END: " + formatDate(currentCompetition.ends_at);

  liveStatus.textContent = "● COMPETITION LIVE";
}

async function loadBusinesses() {
  businesses = await request(
    "/bc_businesses?select=id,business_name,whatsapp_number,description,image_url,advertisement_url,is_active,created_at" +
    "&is_active=eq.true&order=created_at.desc&limit=100"
  );

  try {
    leaderboard = await request("/bc_leaderboard?select=*&limit=500");
  } catch {
    leaderboard = [];
  }

  renderBusinesses();
}

async function loadPage() {
  if (loading) return;

  loading = true;
  retryButton.hidden = true;
  pageMessage.textContent = "";

  try {
    await loadCompetition();
    await loadBusinesses();

    if (!currentCompetition) {
      pageMessage.textContent = "No active competition right now.";
    }
  } catch (error) {
    console.error(error);

    pageMessage.textContent =
      "Could not load data: " + error.message;

    retryButton.hidden = false;

    if (!businesses.length) {
      grid.innerHTML =
        '<div class="error">Businesses could not be loaded.</div>';
    }
  } finally {
    loading = false;
  }
}

/*
 * SUPPORT FLOW:
 * 1. Start a tracking session.
 * 2. Wait while the visitor remains on the page.
 * 3. Complete the session through the existing RPC.
 *
 * Only a successful bc_complete_click response is treated
 * as a completed support visit.
 */
async function supportBusiness(businessId, button) {
  if (!currentCompetition) {
    alert("There is no active competition.");
    return;
  }

  const business = businesses.find(item =>
    String(item.id) === String(businessId)
  );

  if (!business) return;

  const message = document.getElementById("message-" + businessId);

  button.disabled = true;
  button.textContent = "RECORDING SUPPORT...";
  message.textContent = "";

  let sessionId = null;

  try {
    const result = await request("/rpc/bc_start_click", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        p_competition_id: currentCompetition.id,
        p_business_id: business.id,
        p_visitor_key: newVisitorKey()
      })
    });

    sessionId = typeof result === "string"
      ? result
      : Array.isArray(result)
        ? result[0]
        : result?.id ?? result?.session_id;

    if (!sessionId) {
      throw new Error("The tracking session was not returned.");
    }

    message.textContent = "Please wait a moment...";

    await new Promise(resolve => setTimeout(resolve, 8000));

    const completed = await request("/rpc/bc_complete_click", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        p_session_id: sessionId
      })
    });

    if (completed !== true && completed !== "true" &&
        !(Array.isArray(completed) && completed[0] === true)) {
      throw new Error("The visit was not confirmed as valid.");
    }

    message.textContent = "Support recorded successfully!";
    button.textContent = "SUPPORT RECORDED";

    await refreshLeaderboard();

    return;

  } catch (error) {
    console.error(error);

    message.textContent =
      "Support could not be confirmed. Please try again.";

    button.textContent = "TRY AGAIN";
  } finally {
    if (button.textContent !== "SUPPORT RECORDED") {
      button.disabled = false;
    }
  }
}

async function refreshLeaderboard() {
  try {
    leaderboard = await request("/bc_leaderboard?select=*&limit=500");
    renderBusinesses();
  } catch (error) {
    console.error("Ranking refresh failed:", error);
  }
}

async function shareBusiness(businessId) {
  const business = businesses.find(item =>
    String(item.id) === String(businessId)
  );

  if (!business) return;

  const shareData = {
    title: business.business_name,
    text: "Support " + business.business_name +
      " in Business Champion of the Week!",
    url: location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(
        shareData.text + " " + shareData.url
      );
      alert("Business link copied.");
    } else {
      prompt("Copy this link:", location.href);
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      prompt("Copy this link:", location.href);
    }
  }
}

retryButton.addEventListener("click", loadPage);

loadPage();
</script>

</body>
</html>
